<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bereko Hub Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="berekologo.jpg" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              head: ["Sora", "system-ui", "sans-serif"],
              body: ["Figtree", "system-ui", "sans-serif"],
            },
            colors: { navy: "#0040A0", sky: "#0088CC" },
          },
        },
      };
    </script>
    <style>
      :root {
        box-sizing: border-box;
        color-scheme: dark;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        margin: 0;
        font-family: Figtree, system-ui, sans-serif;
        background: #07101f;
        color: #e2e8f0;
      }
      .grad {
        background: linear-gradient(135deg, #0040a0, #0088cc);
      }
      .ph {
        background: #0f1b30;
        border: 2px dashed #27406a;
        color: #6c8fc0;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97) translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pulse2 {
        0% {
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
        }
        100% {
          box-shadow: 0 0 0 10px rgba(52, 211, 153, 0);
        }
      }
      .pop {
        animation: pop 0.25s ease both;
      }
      .live {
        animation: pulse2 1.6s infinite;
      }
      select,
      input {
        color-scheme: dark;
      }
      :focus-visible {
        outline: 3px solid #0088cc;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
      const { useState, useEffect } = React;
      const html = htm.bind(React.createElement);
      const TODAY = "2026-11-17";
      const money = (n) => "₦" + Math.round(n).toLocaleString("en-NG");
      const mins = (t) => {
        const [h, x] = t.split(":");
        return +h * 60 + +x;
      };
      const dur = (m) =>
        m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + "m";
      const SPACES = [
        { n: "Private office", cap: 8, rate: 8000 },
        { n: "Hot desk", cap: 20, rate: 2500 },
        { n: "Content studio", cap: 2, rate: 15000 },
        { n: "Printing press", cap: 3, rate: 5000 },
        { n: "Event hall", cap: 1, rate: 40000 },
        { n: "Meeting room", cap: 4, rate: 6000 },
      ];
      const sp = (n) => SPACES.find((s) => s.n === n);
      const price = (b) =>
        (sp(b.space).rate * (mins(b.end) - mins(b.start))) / 60;
      const ago = (m) => Date.now() - m * 60000;
      const M0 = [
        [
          "Chinedu Eze",
          "chinedu@tidalmedia.ng",
          "Tidal Media",
          "Content studio",
          95,
          14,
        ],
        [
          "Amaka Obi",
          "amaka@obiandco.com",
          "Obi & Co",
          "Private office",
          212,
          32,
        ],
        [
          "Tamuno Briggs",
          "tamuno@brigg.dev",
          "Freelance dev",
          "Hot desk",
          48,
          9,
        ],
        [
          "Ibinabo Wokoma",
          "ibi@pageturners.ng",
          "Page Turners Club",
          null,
          0,
          5,
        ],
        [
          "Emeka Nwosu",
          "emeka@nwosuprints.com",
          "Nwosu Prints",
          "Printing press",
          130,
          21,
        ],
        ["Sandra Peterside", "sandra@pstudio.ng", "P Studio", null, 0, 3],
        [
          "Kelechi Amadi",
          "kelechi@amadi.ng",
          "Amadi Consult",
          "Meeting room",
          20,
          11,
        ],
        [
          "Tonye Cookey",
          "tonye@cookeylaw.com",
          "Cookey Law",
          "Private office",
          77,
          40,
        ],
        ["Blessing Dike", "blessing@dikeevents.ng", "Dike Events", null, 0, 2],
        [
          "Joseph Alabo",
          "joseph@alabo.io",
          "Freelance designer",
          "Hot desk",
          33,
          17,
        ],
      ].map((m, i) => ({
        id: i + 1,
        name: m[0],
        email: m[1],
        org: m[2],
        space: m[3],
        at: ago(m[4]),
        visits: m[5],
      }));
      const B0 = [
        [
          "Chinedu Eze",
          "Content studio",
          TODAY,
          "09:30",
          "13:00",
          "In progress",
          1,
        ],
        [
          "Emeka Nwosu",
          "Printing press",
          TODAY,
          "11:00",
          "15:00",
          "In progress",
          0,
        ],
        [
          "Ibinabo Wokoma",
          "Event hall",
          "2026-11-18",
          "14:00",
          "17:00",
          "Confirmed",
          0,
        ],
        [
          "Sandra Peterside",
          "Content studio",
          "2026-11-19",
          "10:00",
          "12:00",
          "Pending",
          0,
        ],
        [
          "Blessing Dike",
          "Event hall",
          "2026-11-21",
          "10:00",
          "16:00",
          "Confirmed",
          1,
        ],
        [
          "Kelechi Amadi",
          "Meeting room",
          "2026-11-16",
          "09:30",
          "10:30",
          "Completed",
          1,
        ],
      ].map((b, i) => ({
        id: i + 1,
        member: b[0],
        space: b[1],
        date: b[2],
        start: b[3],
        end: b[4],
        status: b[5],
        paid: !!b[6],
      }));
      const J0 = [
        ["Nwosu Prints", "500 flyers A5", 2, "Printing"],
        ["Cookey Law", "Business cards x200", 1, "Received"],
        ["Dike Events", "Roll-up banner", 1, "Ready"],
        ["Page Turners Club", "Book covers x50", 3, "Received"],
        ["Obi & Co", "Brochures x300", 1, "Collected"],
      ].map((j, i) => ({ id: i + 1, client: j[0], item: j[1], stage: j[3] }));
      const STAGES = ["Received", "Printing", "Ready", "Collected"];
      const tone = {
        "In progress": "bg-emerald-500/15 text-emerald-300",
        Confirmed: "bg-sky/20 text-sky-300",
        Pending: "bg-amber-500/15 text-amber-300",
        Completed: "bg-slate-500/20 text-slate-300",
        Cancelled: "bg-red-500/15 text-red-300",
      };
      const Pill = ({ s }) =>
        html`<span
          className=${"px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap " +
          tone[s]}
          >${s}</span
        >`;
      const Av = ({ n, size = "w-9 h-9" }) =>
        html`<span
          className=${size +
          " grad rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"}
          >${n
            .split(" ")
            .map((x) => x[0])
            .slice(0, 2)
            .join("")}</span
        >`;
      const Logo = ({ size = 34 }) =>
        html`<svg
          width=${size}
          height=${size}
          viewBox="200 200 680 680"
          aria-hidden="true"
        >
          <g fill="#fff" fill-rule="evenodd">
            <rect x="225" y="226" width="300" height="627" rx="150" />
            <path
              d="M679 226a176 176 0 1 1 0 352a176 176 0 1 1 0-352zm0 74a102 102 0 1 0 0 204a102 102 0 1 0 0-204z"
            />
            <path
              d="M679 502a176 176 0 1 1 0 352a176 176 0 1 1 0-352zm0 74a102 102 0 1 0 0 204a102 102 0 1 0 0-204z"
            />
          </g>
        </svg>`;
      const icons = {
        Overview: "M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10",
        Bookings:
          "M7 3v3m10-3v3M4 8h16M5 5h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z",
        Members: "M16 11a4 4 0 10-8 0 4 4 0 008 0zM4 21a8 8 0 0116 0",
        "Live now":
          "M12 12m-2 0a2 2 0 104 0 2 2 0 10-4 0M7.8 7.8a6 6 0 000 8.4M16.2 7.8a6 6 0 010 8.4",
        Spaces: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
        Payments: "M3 7h18v10H3zM3 11h18",
        "Print jobs": "M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z",
      };
      const Ic = ({ n }) =>
        html`<svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="1.8"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d=${icons[n]} />
        </svg>`;
      const card = "rounded-2xl bg-[#0F1B30] border border-white/5";
      const inp =
        "mt-1.5 w-full rounded-xl bg-[#07101F] border border-white/10 px-3 py-2.5 text-sm outline-none focus:border-sky";

      function Login({ onIn }) {
        const [e, setE] = useState("admin@berekohub.com");
        const [p, setP] = useState("");
        const [err, setErr] = useState("");
        const go = () => {
          if (
            e.trim().toLowerCase() !== "admin@berekohub.com" ||
            p.length < 4
          ) {
            setErr(
              "Use admin@berekohub.com and a password of 4 or more characters.",
            );
            return;
          }
          onIn();
        };
        return html`<div
          className="min-h-screen flex items-center justify-center p-6"
        >
          <div className="pop w-full max-w-sm">
            <div className="flex items-center gap-3 mb-8">
              <span
                className="grad w-12 h-12 rounded-2xl flex items-center justify-center"
                ><${Logo} size=${30}
              /></span>
              <div>
                <p className="font-head font-bold text-xl">Bereko Hub</p>
                <p className="text-sm text-slate-400">Admin console</p>
              </div>
            </div>
            <label className="block text-sm"
              >Email<input
                value=${e}
                onInput=${(x) => setE(x.target.value)}
                className=${inp}
            /></label>
            <label className="block text-sm mt-4"
              >Password<input
                type="password"
                value=${p}
                onInput=${(x) => setP(x.target.value)}
                onKeyDown=${(x) => x.key === "Enter" && go()}
                className=${inp}
            /></label>
            ${err &&
            html`<p role="alert" className="mt-3 text-sm text-red-300">
              ${err}
            </p>`}
            <button
              onClick=${go}
              className="mt-6 w-full grad text-white font-semibold py-3 rounded-xl"
            >
              Log in
            </button>
            <p className="mt-4 text-xs text-slate-500">
              Prototype: any password of 4 or more characters works.
            </p>
          </div>
        </div>`;
      }

      function Modal({ title, children, onClose }) {
        return html`<div
          className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"
          onClick=${onClose}
        >
          <div
            className="pop w-full max-w-md rounded-3xl bg-[#0F1B30] border border-white/10 p-6 max-h-[90vh] overflow-y-auto"
            onClick=${(e) => e.stopPropagation()}
          >
            <h2 className="font-head font-bold text-xl mb-5">${title}</h2>
            ${children}
          </div>
        </div>`;
      }

      function BookModal({ members, books, onClose, onSave }) {
        const [f, setF] = useState({
          member: members[0].name,
          guest: "",
          space: SPACES[0].n,
          date: "2026-11-18",
          start: "09:30",
          end: "11:30",
        });
        const [err, setErr] = useState("");
        const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
        const save = () => {
          const who = f.member === "__new" ? f.guest.trim() : f.member;
          if (!who) return setErr("Enter the guest name.");
          if (mins(f.end) <= mins(f.start))
            return setErr("End time must be after the start time.");
          if (mins(f.start) < 570 || mins(f.end) > 1050)
            return setErr("The hub is open 9:30am to 5:30pm.");
          const clash = books.filter(
            (b) =>
              b.space === f.space &&
              b.date === f.date &&
              b.status !== "Cancelled" &&
              mins(b.start) < mins(f.end) &&
              mins(b.end) > mins(f.start),
          ).length;
          if (clash >= sp(f.space).cap)
            return setErr(
              f.space +
                " is fully booked at that time. Pick another time or space.",
            );
          onSave({ ...f, member: who });
        };
        const p =
          mins(f.end) > mins(f.start)
            ? price({ space: f.space, start: f.start, end: f.end })
            : 0;
        return html`<${Modal}
          title="Book a space for someone"
          onClose=${onClose}
          ><div className="grid grid-cols-2 gap-4 text-sm">
            <label className="col-span-2"
              >Member<select
                value=${f.member}
                onChange=${set("member")}
                className=${inp}
              >
                ${members.map(
                  (m) => html`<option key=${m.id}>${m.name}</option>`,
                )}
                <option value="__new">New walk-in guest</option>
              </select></label
            >
            ${f.member === "__new" &&
            html`<label className="col-span-2"
              >Guest name<input
                value=${f.guest}
                onInput=${set("guest")}
                className=${inp}
            /></label>`}
            <label className="col-span-2"
              >Space<select
                value=${f.space}
                onChange=${set("space")}
                className=${inp}
              >
                ${SPACES.map((s) => html`<option key=${s.n}>${s.n}</option>`)}
              </select></label
            >
            <label className="col-span-2"
              >Date<input
                type="date"
                value=${f.date}
                onChange=${set("date")}
                className=${inp}
            /></label>
            <label
              >Start<input
                type="time"
                value=${f.start}
                onChange=${set("start")}
                className=${inp} /></label
            ><label
              >End<input
                type="time"
                value=${f.end}
                onChange=${set("end")}
                className=${inp}
            /></label>
          </div>
          <p className="mt-4 text-sm text-slate-300">
            Total: <b className="text-white">${money(p)}</b>
          </p>
          ${err &&
          html`<p role="alert" className="mt-3 text-sm text-red-300">
            ${err}
          </p>`}
          <div className="mt-6 flex justify-end gap-3">
            <button
              onClick=${onClose}
              className="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-white/5"
            >
              Cancel</button
            ><button
              onClick=${save}
              className="grad text-white px-5 py-2.5 rounded-xl text-sm font-semibold"
            >
              Confirm booking
            </button>
          </div><//
        >`;
      }

      function MemberModal({ onClose, onSave }) {
        const [f, setF] = useState({ name: "", email: "", org: "" });
        const [err, setErr] = useState("");
        const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
        return html`<${Modal} title="Add a member" onClose=${onClose}
          ><div className="space-y-4 text-sm">
            <label className="block"
              >Full name<input
                value=${f.name}
                onInput=${set("name")}
                className=${inp}
            /></label>
            <label className="block"
              >Email<input
                value=${f.email}
                onInput=${set("email")}
                className=${inp}
            /></label>
            <label className="block"
              >Company or role<input
                value=${f.org}
                onInput=${set("org")}
                className=${inp}
            /></label>
          </div>
          ${err &&
          html`<p role="alert" className="mt-3 text-sm text-red-300">
            ${err}
          </p>`}
          <div className="mt-6 flex justify-end gap-3">
            <button
              onClick=${onClose}
              className="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-white/5"
            >
              Cancel</button
            ><button
              onClick=${() =>
                f.name.trim() && f.email.includes("@")
                  ? onSave(f)
                  : setErr("Enter a name and a valid email.")}
              className="grad text-white px-5 py-2.5 rounded-xl text-sm font-semibold"
            >
              Add member
            </button>
          </div><//
        >`;
      }

      function Admin({ onOut }) {
        const [tab, setTab] = useState("Overview");
        const [members, setMembers] = useState(M0);
        const [books, setBooks] = useState(B0);
        const [jobs, setJobs] = useState(J0);
        const [modal, setModal] = useState(null);
        const [q, setQ] = useState("");
        const [filter, setFilter] = useState("All");
        const [toast, setToast] = useState("");
        const [nav, setNav] = useState(false);
        const [now, setNow] = useState(Date.now());
        const [log, setLog] = useState([
          ["08:52", "Chinedu Eze checked in to Content studio"],
          ["09:10", "Emeka Nwosu checked in to Printing press"],
        ]);
        useEffect(() => {
          const t = setInterval(() => setNow(Date.now()), 30000);
          return () => clearInterval(t);
        }, []);
        const act = (m) => {
          setToast(m);
          setTimeout(() => setToast(""), 2600);
          const d = new Date();
          setLog((l) =>
            [
              [d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"), m],
              ...l,
            ].slice(0, 30),
          );
        };
        const live = members.filter((m) => m.space);
        const since = (m) => Math.max(0, Math.floor((now - m.at) / 60000));
        const checkIn = (id, space) => {
          const m = members.find((x) => x.id === id);
          setMembers(
            members.map((x) =>
              x.id === id
                ? { ...x, space, at: Date.now(), visits: x.visits + 1 }
                : x,
            ),
          );
          act(m.name + " checked in to " + space);
        };
        const checkOut = (id) => {
          const m = members.find((x) => x.id === id);
          setMembers(
            members.map((x) => (x.id === id ? { ...x, space: null } : x)),
          );
          act(m.name + " checked out");
        };
        const setSt = (b, s) => {
          setBooks(books.map((x) => (x.id === b.id ? { ...x, status: s } : x)));
          act(b.member + ": " + b.space + " " + s.toLowerCase());
        };
        const togglePaid = (b) => {
          setBooks(
            books.map((x) => (x.id === b.id ? { ...x, paid: !x.paid } : x)),
          );
          act(
            b.paid
              ? "Marked unpaid: " + b.member
              : "Payment received from " +
                  b.member +
                  " (" +
                  money(price(b)) +
                  ")",
          );
        };
        const addBook = (b) => {
          setBooks([
            { ...b, id: Date.now(), status: "Confirmed", paid: false },
            ...books,
          ]);
          setModal(null);
          act("Booked " + b.space + " for " + b.member);
        };
        const addMember = (f) => {
          setMembers([
            { id: Date.now(), ...f, space: null, at: 0, visits: 0 },
            ...members,
          ]);
          setModal(null);
          act(f.name + " added as a member");
        };
        const advance = (j) => {
          const n = STAGES[STAGES.indexOf(j.stage) + 1];
          setJobs(jobs.map((x) => (x.id === j.id ? { ...x, stage: n } : x)));
          act(j.client + ": " + j.item + " is now " + n.toLowerCase());
        };
        const active = books.filter((b) => b.status !== "Cancelled");
        const paidTotal = active
            .filter((b) => b.paid)
            .reduce((a, b) => a + price(b), 0),
          dueTotal = active
            .filter((b) => !b.paid)
            .reduce((a, b) => a + price(b), 0);
        const stats = [
          ["Checked in now", live.length, "text-emerald-300"],
          [
            "Bookings today",
            books.filter((b) => b.date === TODAY && b.status !== "Cancelled")
              .length,
            "text-sky-300",
          ],
          ["Revenue collected", money(paidTotal), "text-white"],
          ["Awaiting payment", money(dueTotal), "text-amber-300"],
        ];
        const week = [
          ["Mon", 18],
          ["Tue", 24],
          ["Wed", 21],
          ["Thu", 29],
          ["Fri", 26],
          ["Sat", 12],
        ];
        const Actions = (b) =>
          html`<td className="pr-4 text-right whitespace-nowrap space-x-3">
            ${b.status === "Pending" &&
            html`<button
              onClick=${() => setSt(b, "Confirmed")}
              className="text-sky-300 font-semibold"
            >
              Approve
            </button>`}
            ${b.status === "Confirmed" &&
            html`<button
              onClick=${() => setSt(b, "In progress")}
              className="text-emerald-300 font-semibold"
            >
              Start
            </button>`}
            ${b.status === "In progress" &&
            html`<button
              onClick=${() => setSt(b, "Completed")}
              className="text-emerald-300 font-semibold"
            >
              Complete
            </button>`}
            ${(b.status === "Pending" || b.status === "Confirmed") &&
            html`<button
              onClick=${() => setSt(b, "Cancelled")}
              className="text-red-300 font-semibold"
            >
              Cancel
            </button>`}
          </td>`;
        const BookTable = (list) =>
          html`<div className=${card + " overflow-x-auto"}>
            <table className="w-full text-sm min-w-[720px]">
              <thead className="text-left text-slate-400">
                <tr>
                  <th className="p-4 font-medium">Member</th>
                  <th className="font-medium">Space</th>
                  <th className="font-medium">When</th>
                  <th className="font-medium">Amount</th>
                  <th className="font-medium">Status</th>
                  <th className="pr-4 text-right font-medium">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${list.map(
                  (b) =>
                    html`<tr key=${b.id} className="border-t border-white/5">
                      <td className="p-4">
                        <div className="flex items-center gap-3">
                          <${Av} n=${b.member} />${b.member}
                        </div>
                      </td>
                      <td>${b.space}</td>
                      <td className="text-slate-300">
                        ${b.date}, ${b.start} to ${b.end}
                      </td>
                      <td>
                        ${money(price(b))}
                        <span
                          className=${b.paid
                            ? "text-emerald-300"
                            : "text-amber-300"}
                          >${b.paid ? "paid" : "due"}</span
                        >
                      </td>
                      <td><${Pill} s=${b.status} /></td>
                      ${Actions(b)}
                    </tr>`,
                )}
                ${list.length === 0 &&
                html`<tr>
                  <td colspan="6" className="p-6 text-slate-400">
                    No bookings here. Use New booking to add one.
                  </td>
                </tr>`}
              </tbody>
            </table>
          </div>`;
        const LiveList = (n) =>
          html`<div className="space-y-2">
            ${live.slice(0, n).map(
              (m) =>
                html`<div
                  key=${m.id}
                  className="flex items-center gap-3 p-3 rounded-xl bg-white/[.03]"
                >
                  <${Av} n=${m.name} />
                  <div className="min-w-0 flex-1">
                    <p className="font-semibold truncate">${m.name}</p>
                    <p className="text-xs text-slate-400 truncate">
                      ${m.space}, in for ${dur(since(m))}
                    </p>
                  </div>
                  <span
                    className="w-2.5 h-2.5 rounded-full bg-emerald-400 live"
                  ></span>
                </div>`,
            )}${live.length === 0 &&
            html`<p className="text-sm text-slate-400">
              Nobody is checked in.
            </p>`}
          </div>`;
        const views = {
          Overview: () =>
            html`<div className="space-y-6">
              <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
                ${stats.map(
                  (s) =>
                    html`<div key=${s[0]} className=${card + " p-5"}>
                      <p className="text-sm text-slate-400">${s[0]}</p>
                      <p
                        className=${"font-head font-bold text-3xl mt-2 " + s[2]}
                      >
                        ${s[1]}
                      </p>
                    </div>`,
                )}
              </div>
              <div className="grid xl:grid-cols-3 gap-6">
                <div className=${card + " xl:col-span-2 p-6"}>
                  <h3 className="font-head font-semibold">Visits this week</h3>
                  <div className="mt-6 flex items-end gap-4 h-44">
                    ${week.map(
                      ([d, v]) =>
                        html`<div
                          key=${d}
                          className="flex-1 flex flex-col items-center gap-2 h-full justify-end"
                        >
                          <span className="text-xs text-slate-400">${v}</span>
                          <div
                            className="w-full rounded-t-lg grad"
                            style=${{ height: (v / 30) * 100 + "%" }}
                          ></div>
                          <span className="text-xs text-slate-400">${d}</span>
                        </div>`,
                    )}
                  </div>
                </div>
                <div className=${card + " p-6"}>
                  <div className="flex justify-between mb-4">
                    <h3 className="font-head font-semibold">In the hub now</h3>
                    <button
                      onClick=${() => setTab("Live now")}
                      className="text-sky-300 text-sm font-semibold"
                    >
                      See all
                    </button>
                  </div>
                  ${LiveList(4)}
                </div>
              </div>
              <div className="grid xl:grid-cols-3 gap-6">
                <div className="xl:col-span-2">
                  <h3 className="font-head font-semibold mb-3">
                    Today's bookings
                  </h3>
                  ${BookTable(books.filter((b) => b.date === TODAY))}
                </div>
                <div className=${card + " p-6"}>
                  <h3 className="font-head font-semibold mb-4">Activity</h3>
                  <div className="space-y-3 max-h-72 overflow-y-auto">
                    ${log
                      .slice(0, 8)
                      .map(
                        (l, i) =>
                          html`<p key=${i} className="text-sm">
                            <span className="text-slate-500 mr-2">${l[0]}</span
                            >${l[1]}
                          </p>`,
                      )}
                  </div>
                </div>
              </div>
            </div>`,
          Bookings: () =>
            html`<div>
              <div className="flex flex-wrap gap-2 mb-4">
                ${[
                  "All",
                  "Pending",
                  "Confirmed",
                  "In progress",
                  "Completed",
                  "Cancelled",
                ].map(
                  (s) =>
                    html`<button
                      key=${s}
                      onClick=${() => setFilter(s)}
                      className=${"px-3.5 py-1.5 rounded-full text-sm font-medium transition " +
                      (filter === s
                        ? "grad text-white"
                        : "bg-white/5 text-slate-300 hover:bg-white/10")}
                    >
                      ${s}
                    </button>`,
                )}
              </div>
              ${BookTable(
                books.filter((b) => filter === "All" || b.status === filter),
              )}
            </div>`,
          Members: () =>
            html`<div>
              <input
                value=${q}
                onInput=${(e) => setQ(e.target.value)}
                placeholder="Search members"
                className="mb-4 w-full sm:w-80 rounded-xl bg-[#0F1B30] border border-white/10 px-4 py-2.5 text-sm outline-none focus:border-sky"
              />
              <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
                ${members
                  .filter((m) =>
                    (m.name + m.org).toLowerCase().includes(q.toLowerCase()),
                  )
                  .map(
                    (m) =>
                      html`<div key=${m.id} className=${card + " p-5"}>
                        <div className="flex items-center gap-3">
                          <${Av} n=${m.name} size="w-11 h-11" />
                          <div className="min-w-0">
                            <p className="font-semibold truncate">${m.name}</p>
                            <p className="text-xs text-slate-400 truncate">
                              ${m.org}
                            </p>
                          </div>
                        </div>
                        <p className="text-xs text-slate-400 mt-3 truncate">
                          ${m.email}
                        </p>
                        <div
                          className="mt-4 flex items-center justify-between gap-2"
                        >
                          <span className="text-xs text-slate-400"
                            >${m.visits} visits</span
                          >${m.space
                            ? html`<button
                                onClick=${() => checkOut(m.id)}
                                className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-red-500/15 text-red-300"
                              >
                                Check out of ${m.space}
                              </button>`
                            : html`<select
                                value=""
                                onChange=${(e) =>
                                  e.target.value &&
                                  checkIn(m.id, e.target.value)}
                                aria-label=${"Check in " + m.name}
                                className="text-xs font-semibold px-2 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-300 outline-none"
                              >
                                <option value="">Check in to…</option>
                                ${SPACES.map(
                                  (s) =>
                                    html`<option
                                      key=${s.n}
                                      value=${s.n}
                                      className="text-black"
                                    >
                                      ${s.n}
                                    </option>`,
                                )}
                              </select>`}
                        </div>
                      </div>`,
                  )}
              </div>
            </div>`,
          "Live now": () =>
            html`<div>
              <p className="text-slate-400 mb-4">
                ${live.length} people are in the hub. Times refresh every 30
                seconds.
              </p>
              <div className="grid md:grid-cols-2 gap-4">
                ${live.map(
                  (m) =>
                    html`<div
                      key=${m.id}
                      className=${card + " p-5 flex items-center gap-4"}
                    >
                      <${Av} n=${m.name} size="w-12 h-12" />
                      <div className="flex-1 min-w-0">
                        <p
                          className="font-semibold truncate flex items-center gap-2"
                        >
                          ${m.name}<span
                            className="w-2 h-2 rounded-full bg-emerald-400 live"
                          ></span>
                        </p>
                        <p className="text-sm text-slate-400">${m.space}</p>
                        <p className="text-xs text-slate-500">
                          ${m.org}, in for ${dur(since(m))}
                        </p>
                      </div>
                      <button
                        onClick=${() => checkOut(m.id)}
                        className="text-sm font-semibold px-3 py-2 rounded-lg bg-white/5 hover:bg-red-500/15 hover:text-red-300 transition"
                      >
                        Check out
                      </button>
                    </div>`,
                )}
              </div>
              ${live.length === 0 &&
              html`<p className="text-slate-400">
                Nobody is checked in. Check someone in from Members.
              </p>`}
            </div>`,
          Spaces: () =>
            html`<div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
              ${SPACES.map((s) => {
                const u = live.filter((m) => m.space === s.n).length;
                return html`<div
                  key=${s.n}
                  className=${card + " overflow-hidden"}
                >
                  <div
                    className="ph h-28 flex items-center justify-center text-xs border-0 border-b-2"
                  >
                    Photo: ${s.n.toLowerCase()}
                  </div>
                  <div className="p-5">
                    <div className="flex justify-between">
                      <h3 className="font-head font-semibold">${s.n}</h3>
                      <span className="text-sm text-slate-400"
                        >${u} of ${s.cap} in use</span
                      >
                    </div>
                    <div
                      className="mt-3 h-2 rounded-full bg-white/10 overflow-hidden"
                    >
                      <div
                        className="h-full grad transition-all duration-700"
                        style=${{
                          width: Math.min(100, (u / s.cap) * 100) + "%",
                        }}
                      ></div>
                    </div>
                    <p className="mt-3 text-sm text-slate-400">
                      ${money(s.rate)} per hour,
                      ${books.filter(
                        (b) =>
                          b.space === s.n &&
                          b.date >= TODAY &&
                          b.status !== "Cancelled" &&
                          b.status !== "Completed",
                      ).length}
                      upcoming bookings
                    </p>
                  </div>
                </div>`;
              })}
            </div>`,
          Payments: () =>
            html`<div className="space-y-6">
              <div className="grid sm:grid-cols-2 gap-4">
                <div className=${card + " p-5"}>
                  <p className="text-sm text-slate-400">Collected</p>
                  <p
                    className="font-head font-bold text-3xl text-emerald-300 mt-2"
                  >
                    ${money(paidTotal)}
                  </p>
                </div>
                <div className=${card + " p-5"}>
                  <p className="text-sm text-slate-400">Awaiting payment</p>
                  <p
                    className="font-head font-bold text-3xl text-amber-300 mt-2"
                  >
                    ${money(dueTotal)}
                  </p>
                </div>
              </div>
              <div className=${card + " overflow-x-auto"}>
                <table className="w-full text-sm min-w-[560px]">
                  <thead className="text-left text-slate-400">
                    <tr>
                      <th className="p-4 font-medium">Member</th>
                      <th className="font-medium">Booking</th>
                      <th className="font-medium">Amount</th>
                      <th className="pr-4 text-right font-medium">Payment</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${active.map(
                      (b) =>
                        html`<tr
                          key=${b.id}
                          className="border-t border-white/5"
                        >
                          <td className="p-4">${b.member}</td>
                          <td className="text-slate-300">
                            ${b.space}, ${b.date}
                          </td>
                          <td>${money(price(b))}</td>
                          <td className="pr-4 text-right">
                            <button
                              onClick=${() => togglePaid(b)}
                              className=${"text-xs font-semibold px-3 py-1.5 rounded-lg " +
                              (b.paid
                                ? "bg-emerald-500/15 text-emerald-300"
                                : "bg-amber-500/15 text-amber-300")}
                            >
                              ${b.paid ? "Paid. Undo" : "Mark as paid"}
                            </button>
                          </td>
                        </tr>`,
                    )}
                  </tbody>
                </table>
              </div>
            </div>`,
          "Print jobs": () =>
            html`<div className="grid md:grid-cols-2 xl:grid-cols-4 gap-4">
              ${STAGES.map(
                (st) =>
                  html`<div key=${st} className=${card + " p-4"}>
                    <h3 className="font-head font-semibold mb-3">
                      ${st}
                      <span className="text-slate-500 text-sm"
                        >${jobs.filter((j) => j.stage === st).length}</span
                      >
                    </h3>
                    <div className="space-y-3">
                      ${jobs
                        .filter((j) => j.stage === st)
                        .map(
                          (j) =>
                            html`<div
                              key=${j.id}
                              className="rounded-xl bg-white/[.04] p-3"
                            >
                              <p className="font-semibold text-sm">
                                ${j.client}
                              </p>
                              <p className="text-xs text-slate-400">
                                ${j.item}
                              </p>
                              ${st !== "Collected" &&
                              html`<button
                                onClick=${() => advance(j)}
                                className="mt-3 text-xs font-semibold text-sky-300"
                              >
                                Move to
                                ${STAGES[STAGES.indexOf(st) + 1].toLowerCase()}
                              </button>`}
                            </div>`,
                        )}
                    </div>
                  </div>`,
              )}
            </div>`,
        };
        const actions = html`<div className="flex gap-2">
          <button
            onClick=${() => setModal("member")}
            className="hidden sm:block text-sm font-semibold px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10"
          >
            Add member</button
          ><button
            onClick=${() => setModal("book")}
            className="grad text-white text-sm font-semibold px-4 py-2.5 rounded-xl"
          >
            New booking
          </button>
        </div>`;
        return html`<div className="min-h-screen flex">
          <aside
            className=${"fixed lg:sticky top-0 z-30 h-screen w-64 bg-[#0A1426] border-r border-white/5 p-5 flex flex-col transition-transform " +
            (nav ? "translate-x-0" : "-translate-x-full lg:translate-x-0")}
          >
            <div
              className="flex items-center gap-2 font-head font-bold text-lg mb-8"
            >
              <${Logo} />Bereko Admin
            </div>
            <nav className="space-y-1">
              ${Object.keys(views).map(
                (t) =>
                  html`<button
                    key=${t}
                    onClick=${() => {
                      setTab(t);
                      setNav(false);
                    }}
                    className=${"w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition " +
                    (tab === t
                      ? "grad text-white"
                      : "text-slate-400 hover:bg-white/5 hover:text-white")}
                  >
                    <${Ic} n=${t} />${t}${t === "Live now" &&
                    html`<span
                      className="ml-auto text-xs bg-emerald-400/20 text-emerald-300 rounded-full px-2"
                      >${live.length}</span
                    >`}
                  </button>`,
              )}
            </nav>
            <div
              className="mt-auto flex items-center gap-3 p-3 rounded-xl bg-white/[.03]"
            >
              <${Av} n="Admin User" />
              <div className="text-sm">
                <p className="font-semibold">Admin</p>
                <button
                  onClick=${onOut}
                  className="text-xs text-slate-400 hover:text-white"
                >
                  Log out
                </button>
              </div>
            </div>
          </aside>
          <main className="flex-1 min-w-0 p-5 md:p-8">
            <div className="flex items-center justify-between gap-3 mb-8">
              <div className="flex items-center gap-3">
                <button
                  onClick=${() => setNav(!nav)}
                  className="lg:hidden px-3 py-2 rounded-lg bg-white/5 text-sm"
                >
                  Menu
                </button>
                <div>
                  <h1 className="font-head font-bold text-2xl">${tab}</h1>
                  <p className="text-sm text-slate-400">
                    Tuesday, 17 November 2026
                  </p>
                </div>
              </div>
              ${actions}
            </div>
            <div key=${tab} className="pop">${views[tab]()}</div>
          </main>
          ${modal === "book" &&
          html`<${BookModal}
            members=${members}
            books=${books}
            onClose=${() => setModal(null)}
            onSave=${addBook}
          />`}
          ${modal === "member" &&
          html`<${MemberModal}
            onClose=${() => setModal(null)}
            onSave=${addMember}
          />`}
          ${toast &&
          html`<div
            role="status"
            className="pop fixed bottom-6 left-1/2 -translate-x-1/2 bg-white text-slate-900 font-semibold text-sm px-5 py-3 rounded-full shadow-xl z-50"
          >
            ${toast}
          </div>`}
        </div>`;
      }
      function App() {
        const [ok, setOk] = useState(false);
        return ok
          ? html`<${Admin} onOut=${() => setOk(false)} />`
          : html`<${Login} onIn=${() => setOk(true)} />`;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        html`<${App} />`,
      );
    </script>
  </body>
</html>
